// 打包分发：把两个模组子项目的 jar 汇总到 dist/（加入 .gitignore，不进仓库）。
// 项目默认启用配置缓存；dist 任务在执行期跨项目取产物路径，与配置缓存不兼容，
// 运行时使用 `./gradlew dist --no-configuration-cache`（README-SETUP.md 有说明）。
tasks.register('dist') {
    group = 'build'
    description = "Collects both mod jars into dist/ (run with --no-configuration-cache)."
    dependsOn ':Xingyue:build', ':FlyingEnchant:build'
    doLast {
        def distDir = new File(projectDir, 'dist')
        distDir.deleteDir()
        distDir.mkdirs()
        ['Xingyue', 'FlyingEnchant'].each { sub ->
            new File(project(sub).projectDir, 'build/libs').listFiles()?.each { jar ->
                if (jar.name.endsWith('.jar') && !jar.name.endsWith('-sources.jar')
                        && !jar.name.endsWith('-dev.jar') && !jar.name.endsWith('-slim.jar')
                        && !jar.name.endsWith('-universal.jar')) {
                    java.nio.file.Files.copy(jar.toPath(), new File(distDir, jar.name).toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
        println "dist/ -> ${distDir.listFiles().collect { it.name }}"
    }
}