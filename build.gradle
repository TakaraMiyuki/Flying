plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}


version = mod_version
group = group_id

base {
    archivesName = mod_id
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        flying_enchant {
            sourceSet sourceSets.main
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// MDG 的内部工具任务（downloadAssets/createArtifacts）默认请求一个 Java 21 工具链，
// 机器上没有已安装的 21 时会触发联网自动供应（foojay，需代理，IDEA 环境下易失败）。
// 统一改用项目工具链（25）运行这些工具，避免对额外 JDK 的依赖。
def moddevToolsLauncher = javaToolchains.launcherFor {
    languageVersion = java.toolchain.languageVersion
}
tasks.withType(net.neoforged.nfrtgradle.DownloadAssets).configureEach {
    javaExecutable = moddevToolsLauncher.map { it.executablePath.asFile.absolutePath }
}
tasks.withType(net.neoforged.nfrtgradle.CreateMinecraftArtifacts).configureEach {
    toolsJavaExecutable = moddevToolsLauncher.map { it.executablePath.asFile.absolutePath }
    javaExecutable = moddevToolsLauncher.map { it.executablePath.asFile.absolutePath }
}
