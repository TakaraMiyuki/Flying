license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

# The authors of the mod, displayed in the mod UI
authors="${mod_authors}"
description='''
飞翔（flying）附魔：让重锤获得"空中突进"能力——下坠攻击触发风爆弹起后，按跳跃键即可向前上方突进。
仅可作用于重锤与星月（重锤需先附魔风爆）；与星月模组（xingyue）互相独立、可选共存。
1.2.0 起新增同名状态效果（flying_enchant:flying）：持有效果时疾跑按跳跃键即可突进，除玩家外所有生物免疫。
(Flying: a Mace air-dash enchantment, plus a Flying mob effect — sprint + jump to dash; non-players are immune.)
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
#[[mixins]]
#config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 星月模组（可选）：同时安装时星月也可获得"飞翔"附魔与空中突进。
# 区间从下限放开：Maven 版本序把 0.1.0-beta 视为小于 0.1.0，写死下限会让任何
# 带预发布后缀的星月版本被判不满足；兼容契约实际由共享 item tag 承担，区间从宽。
[[dependencies.${mod_id}]]
    modId="xingyue"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"